<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>.i18n-wait body{{visibility:hidden}}</style>
  <script>/* language: ?lang=en|fr|he, remembered on this device */(function(){{var d=document.documentElement,l=null;try{{l=new URLSearchParams(location.search).get("lang");if(l)localStorage.setItem("mirel_lang",l);else l=localStorage.getItem("mirel_lang")}}catch(e){{}}if(l!=="en"&&l!=="fr")l="he";window.MIREL_LANG=l;d.lang=l;d.dir=l==="he"?"rtl":"ltr";if(l!=="he"){{d.className+=" i18n-wait";document.write('<script src="../assets/i18n/'+l+'.js"><\/script>');setTimeout(function(){{d.classList.remove("i18n-wait")}},3000)}}}})();</script>
  <title>{title}</title>
  <meta name="description" content="{desc}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.36' cy='.3' r='.75'%3E%3Cstop offset='0' stop-color='%23fde6e6'/%3E%3Cstop offset='1' stop-color='%23d0565a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200;300&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
