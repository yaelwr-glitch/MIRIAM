{{HEAD title="תעודת סיום | מהמטבח לעסק משלי" desc="מחולל תעודת סיום מעוצבת לבוגרות התכנית מהמטבח לעסק משלי של MIREL."}}
<style>
  .cert-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .cert { width: 1000px; aspect-ratio: 1.414 / 1; margin: 0 auto; background: #fffaf6; color: var(--choc); position: relative; overflow: hidden; font-family: var(--font-body); box-shadow: var(--shadow); transform-origin: top right; }
  .cert .frame { position: absolute; inset: 22px; border: 2px solid var(--gold); border-radius: 6px; }
  .cert .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid var(--blush-2); border-radius: 4px; }
  .cert .corner { position: absolute; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--blush), var(--rose)); opacity: .5; }
  .cert .c1 { top: -110px; right: -110px; } .cert .c2 { bottom: -120px; left: -120px; background: radial-gradient(circle at 70% 70%, var(--blush-2), var(--choc-2)); opacity: .28; }
  .cert .inner { position: absolute; inset: 60px 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cert .seal { width: 86px; height: 86px; border-radius: 50%; background: var(--choc); color: var(--blush); display: grid; place-items: center; font-family: var(--font-display); font-size: 2.4rem; box-shadow: 0 0 0 5px #fffaf6, 0 0 0 7px var(--gold); margin-bottom: 14px; }
  .cert .brand { letter-spacing: .3em; font-size: .85rem; color: var(--rose-dark); margin-bottom: 6px; }
  .cert h2 { font-size: 3rem; margin: 0; color: var(--choc); }
  .cert .lead { font-size: 1.1rem; margin: 16px 0 4px; color: var(--choc-2); }
  .cert .name { font-family: var(--font-display); font-size: 3.4rem; color: var(--rose-dark); margin: 4px 0 6px; line-height: 1.15; border-bottom: 1.5px solid var(--gold); padding: 0 40px 8px; min-width: 50%; }
  .cert .body { font-size: 1.05rem; max-width: 640px; line-height: 1.6; color: var(--choc-2); }
  .cert .course { font-family: var(--font-display); font-size: 1.6rem; color: var(--choc); margin: 6px 0 0; }
  .cert .foot { display: flex; justify-content: space-between; width: 100%; margin-top: 34px; font-size: .95rem; }
  .cert .foot div { min-width: 200px; border-top: 1px solid var(--choc-2); padding-top: 6px; }
  .cert .sig { font-family: var(--font-display); font-size: 1.5rem; color: var(--choc); margin-bottom: -2px; border: 0 !important; }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    .cert { width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; transform: none !important; }
    .cert-scroll { overflow: visible; height: auto !important; }
    main .tool-hero, .panel { display: none !important; }
  }
</style>
</head>
<body>
{{HEADER}}
<main id="main">
  <section class="tool-hero no-print">
    <div class="wrap">
      <span class="eyebrow">כלי 14</span>
      <h1>תעודת סיום</h1>
      <p>סיימת את התכנית? מגיע לך! מקלידות את השם ומקבלות תעודה מעוצבת של MIREL להורדה, להדפסה ולתלייה במטבח 🎓</p>
    </div>
  </section>
  <div class="wrap" style="padding-bottom:56px">
    <div class="panel no-print">
      <div class="field-row">
        <div class="field"><label for="c-name">שם מלא כפי שיופיע בתעודה</label><input id="c-name" type="text" autocomplete="name"></div>
        <div class="field"><label for="c-date">תאריך הסיום</label><input id="c-date" type="date"></div>
        <div class="field"><label for="c-business">שם העסק שלך (לא חובה)</label><input id="c-business" type="text"></div>
        <div class="field"><label for="c-cohort">מחזור (לא חובה)</label><input id="c-cohort" type="text" placeholder="מחזור א׳"></div>
      </div>
      <div class="btn-row">
        <button class="btn" id="png-btn" type="button">הורדה כתמונה</button>
        <button class="btn btn-ghost" id="print-btn" type="button">הדפסה / PDF</button>
      </div>
      <p class="hint" id="progress-note"></p>
    </div>
    <div class="cert-scroll" id="cert-scroll"><div class="cert" id="cert" aria-label="תעודת סיום"></div></div>
    <div id="backup"></div>
  </div>
</main>
{{FOOTER}}
<script src="course-data.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/js/certificate.js"></script>
</body>
</html>
